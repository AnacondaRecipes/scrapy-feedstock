{% set name = "scrapy" %}
{% set version = "2.19.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 34130726582b64c91531162ab277c4053e558876d49ba219cb43679e71d80a87

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - scrapy = scrapy.cmdline:execute
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling >=1.27.0
  run:
    - python
    - twisted >=21.7.0
    - aiohttp >=3.13.3
    - charset-normalizer >=3.4.0
    - cryptography >=41.0.5
    - cssselect >=0.9.1
    - defusedxml >=0.7.1
    - itemadapter >=0.1.0
    - itemloaders >=1.0.1
    - lxml >=4.6.4
    - packaging
    - parsel >=1.5.0
    - platformdirs >=2.0.0
    - protego >=0.1.15
    - pyopenssl >=24.3.0
    - queuelib >=1.6.1
    - service_identity >=24.2.0
    - tldextract
    - w3lib >=2.1.1
    - zope.interface >=5.1.0
    # Platform-specific dependencies
    - pydispatcher >=2.0.5  # [python_impl == 'cpython']
    - pypydispatcher >=2.1.0  # [python_impl == 'pypy']
    - backports.zstd >=1.3.0  # [py<314]
    - brotli-python >=1.2.0  # [python_impl != 'pypy']
    - brotlicffi >=1.2.0.0  # [python_impl == 'pypy']

# E   ModuleNotFoundError: No module named 'pyftpdlib'
# Unstable tests: OSError: [Errno 98] Address already in use
{% set ignore_tests = " --ignore=tests/test_feedexport_storages.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_pipeline_files.py" %}
# >       assert total_seconds >= close_on
# E       assert 0.0929999999998472 >= 0.1
{% set deselect_tests = " --deselect=tests/test_closespider.py::TestCloseSpider::test_closespider_timeout" %}
# aiohttp here depends on aiodns (c-ares), so aiohttp resolves hostnames through
# aiodns instead of socket.getaddrinfo, which these tests patch
{% set deselect_tests = deselect_tests + " --deselect=tests/test_downloader_handler_aiohttp.py::TestHttp::test_idna_rejected_hostname" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_downloader_handler_aiohttp.py::TestHttps::test_idna_rejected_hostname" %}

test:
  source_files:
    - conftest.py
    - tests
    - pyproject.toml
  imports:
    - scrapy
  requires:
    - pip
    - attrs
    - pexpect >= 4.8.0
    - pygments
    - pytest
    - pytest-xdist
    - sybil >=1.3.0  # https://github.com/cjw296/sybil/issues/20#issuecomment-605433422
    - testfixtures
    - pytest-twisted >=1.14.3
    - pytest-rerunfailures >=16.7
    - pillow
    - brotli-python >= 1.2.0
    - google-cloud-storage
    - ipython
    - uvloop  # [not win]
    - boto3
    - botocore
    - httpx
  commands:
    - pip check
    - scrapy version -v
    - scrapy bench
    - scrapy --help
    - scrapy genspider -t basic brewspider anaconda.com
    - set "PYTHONIOENCODING=utf8"  # [win]
    # PBP exports an empty REQUESTS_CA_BUNDLE, which botocore >=1.43.54 rejects when creating boto3 clients
    - unset REQUESTS_CA_BUNDLE      # [unix]
    - set "REQUESTS_CA_BUNDLE="     # [win]
    - pytest -n auto --reactor=asyncio -vv tests {{ ignore_tests }} {{ deselect_tests }}

about:
  home: https://www.scrapy.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A high-level Python Screen Scraping framework
  description: |
    Scrapy is an open source and collaborative framework for extracting the
    data you need from websites in a fast, simple, yet extensible way.
  doc_url: https://docs.scrapy.org
  dev_url: https://github.com/scrapy/scrapy

extra:
  recipe-maintainers:
    - rmax
    - redapple
